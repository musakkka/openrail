# Example workflow for an app repository: deploy to openrail on every push
# to main. Copy it to .github/workflows/deploy.yml in your app.
#
# Repository settings > Secrets and variables > Actions:
#   secret   OPENRAIL_TOKEN  an environment token (Project Settings > Tokens)
#   variable OPENRAIL_URL    the console URL of your install
name: deploy
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - id: deploy
        uses: musakkka/openrail@v0.1.0
        with:
          url: ${{ vars.OPENRAIL_URL }}
          token: ${{ secrets.OPENRAIL_TOKEN }}
          service: web
      - run: echo "Live at $URL"
        env:
          URL: ${{ steps.deploy.outputs.url }}
